<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedCare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef5f4;--card:#fff;--ink:#0f2d2b;--mut:#5b7573;--line:#d6e5e2;--pri:#0d9488;--ok:#15803d;--okb:#dcfce7;--hi:#b91c1c;--hib:#fee2e2;--lo:#b45309;--lob:#fef3c7;--sh:0 8px 24px rgba(13,60,56,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1716;--card:#122624;--ink:#e3f1ef;--mut:#8fb0ac;--line:#23413e;--pri:#2dd4bf;--ok:#86efac;--okb:#14532d;--hi:#fca5a5;--hib:#7f1d1d;--lo:#fcd34d;--lob:#78350f;--sh:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0a1716;--card:#122624;--ink:#e3f1ef;--mut:#8fb0ac;--line:#23413e;--pri:#2dd4bf;--ok:#86efac;--okb:#14532d;--hi:#fca5a5;--hib:#7f1d1d;--lo:#fcd34d;--lob:#78350f;--sh:0 8px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:absolute;inset-inline:0;top:env(safe-area-inset-top,0px);z-index:3;color:#fff}
.logo{font-weight:800;font-size:22px;letter-spacing:.3px}
button{font:inherit;cursor:pointer}
.ib{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:6px 14px;backdrop-filter:blur(6px);margin-inline-start:6px}
.hero{position:relative;overflow:hidden;color:#fff;padding:84px 20px 90px;text-align:center;background:linear-gradient(135deg,#0b3b3a,#0f766e 55%,#0e7490)}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px);font-weight:800;position:relative}
.hero p{margin:0 auto;max-width:520px;opacity:.9;position:relative}
.bl{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;animation:fl 9s ease-in-out infinite alternate}
.b1{width:260px;height:260px;background:#2dd4bf;top:-80px;inset-inline-start:-60px}
.b2{width:300px;height:300px;background:#38bdf8;bottom:-140px;inset-inline-end:-80px;animation-delay:-4s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.15)}}
.ecg{position:absolute;bottom:18px;left:0;width:100%;height:48px;opacity:.7}
.ecg path{fill:none;stroke:#99f6e4;stroke-width:2;stroke-dasharray:900;stroke-dashoffset:900;animation:dr 3.6s linear infinite}
@keyframes dr{to{stroke-dashoffset:0}}
main{max-width:1000px;margin:-44px auto 0;padding:0 16px 30px;display:grid;gap:16px;position:relative}
.tabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font-weight:600;transition:.25s}
.tabs button.on{background:var(--pri);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--mut);cursor:pointer;transition:.2s;margin-bottom:12px}
.drop:hover,.drop.dg{border-color:var(--pri);background:rgba(13,148,136,.07);transform:translateY(-2px)}
.drop svg{width:34px;height:34px;stroke:var(--pri);fill:none;stroke-width:1.7}
#pv{max-height:150px;max-width:100%;border-radius:10px}
textarea,input[type=text],input[type=password]{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:150px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:13px}
:is(button,textarea,input,label):focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.btn:disabled{opacity:.6}
.mut{color:var(--mut);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sum button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;box-shadow:var(--sh);transition:.2s}
.sum button.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.sum b{display:block;font-size:28px;line-height:1.2}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.Normal{background:var(--okb);color:var(--ok)}.High{background:var(--hib);color:var(--hi)}.Low{background:var(--lob);color:var(--lo)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;box-shadow:var(--sh);transition:transform .2s}
.c:hover{transform:translateY(-3px)}
.c .t{display:flex;justify-content:space-between;gap:8px}
.c small{display:block;color:var(--mut);font-size:12px}
.v{font-size:26px;font-weight:800}.u{font-size:13px;color:var(--mut);font-weight:400}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.bar{position:relative;height:8px;border-radius:9px;background:var(--line);direction:ltr}
.bar .z{position:absolute;left:25%;width:50%;top:0;bottom:0;background:var(--okb);border-radius:9px}
.bar .m{position:absolute;top:-4px;left:var(--p);width:16px;height:16px;margin-left:-8px;border-radius:50%;border:3px solid var(--card);animation:mk .9s cubic-bezier(.2,.8,.2,1) both}
.m.Normal{background:var(--ok)}.m.High{background:var(--hi)}.m.Low{background:var(--lo)}
@keyframes mk{from{left:25%}}
.rise{animation:ri .5s both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes ri{from{opacity:0;transform:translateY(14px)}}
.tw{overflow-x:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}th{color:var(--mut);font-size:13px}
.tb{display:flex;gap:8px;margin-bottom:0}.tb input{flex:1}
.rx{display:grid;gap:4px;font-size:14px}
.chip{font-size:12px;background:rgba(13,148,136,.12);color:var(--pri);padding:2px 10px;border-radius:99px;font-weight:600;height:fit-content}
.sp{width:16px;height:16px;border:2px solid var(--pri);border-top-color:transparent;border-radius:50%;display:inline-block;animation:sn .7s linear infinite;vertical-align:middle;margin-inline-end:6px}
@keyframes sn{to{transform:rotate(360deg)}}
.pk{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;cursor:pointer}
.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pvw{position:relative;display:inline-block;overflow:hidden;border-radius:10px;line-height:0}
.pvw.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#2dd4bf,transparent);box-shadow:0 0 14px #2dd4bf;animation:sc 1.3s ease-in-out infinite alternate}
@keyframes sc{from{top:0}to{top:calc(100% - 3px)}}
.hero{background-size:200% 200%;animation:gs 14s ease infinite}@keyframes gs{50%{background-position:100% 50%}}
.fl{position:absolute;bottom:-30px;opacity:0;pointer-events:none;animation:up linear infinite}
@keyframes up{10%{opacity:.5}90%{opacity:.3}to{transform:translateY(-440px) rotate(40deg);opacity:0}}
.btn:active{transform:scale(.95)}
.btn.p.busy{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:200% 100%;animation:shm 1.1s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
.badge.High{animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 0 5px rgba(220,38,38,.18)}}
.logo{display:flex;align-items:center;gap:6px}.logo i{font-style:normal;display:inline-block;animation:hb 1.6s infinite}@keyframes hb{15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,400px);box-shadow:var(--sh);animation:pop .3s}
dialog::backdrop{background:rgba(5,20,19,.55);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}}
dialog input{margin:5px 0}dialog h3{margin:0 0 8px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.sv small{display:block;color:var(--mut)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,120px);background:var(--pri);color:#fff;padding:10px 20px;border-radius:99px;z-index:9;transition:.4s cubic-bezier(.2,.9,.3,1.3)}#toast.on{transform:translate(-50%,0)}
.ft{text-align:center;font-weight:800;font-size:15px;letter-spacing:.5px;direction:ltr;color:var(--mut);padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-width:1000px;margin:10px auto 0}
[hidden]{display:none!important}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.hero h1{animation:ri .9s both}.hero p{animation:ri .9s .18s both}
.gb{animation:ri .5s both,bc 7s linear .5s infinite}@keyframes bc{33%{border-color:#38bdf8;box-shadow:0 8px 30px rgba(56,189,248,.18)}66%{border-color:#a78bfa;box-shadow:0 8px 30px rgba(167,139,250,.18)}}
.drop svg{animation:bn 2.4s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-6px)}}
.btn,.ib,.sum button{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}@keyframes rpl{to{transform:scale(4);opacity:0}}
.c{position:relative}.c::after{content:"";position:absolute;inset:0;border-radius:14px;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(45,212,191,.18),transparent 60%);opacity:0;transition:.3s;pointer-events:none}.c:hover::after{opacity:1}
.sum.pop button{animation:pp .55s cubic-bezier(.3,1.4,.5,1) both}.sum.pop button:nth-child(2){animation-delay:.08s}.sum.pop button:nth-child(3){animation-delay:.16s}.sum.pop button:nth-child(4){animation-delay:.24s}
@keyframes pp{from{opacity:0;transform:scale(.7)}}
.h{margin:0 0 4px;font-size:18px}
.wy{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--bg);transition:box-shadow .3s}.wy[open]{box-shadow:var(--sh)}
.wy summary{display:flex;gap:8px;align-items:center;padding:12px;cursor:pointer;list-style:none}.wy summary::-webkit-details-marker{display:none}
.wy .ch{margin-inline-start:auto;transition:transform .3s}.wy[open] .ch{transform:rotate(180deg)}
.wb{padding:0 14px 12px;animation:dd .4s}@keyframes dd{from{opacity:0;transform:translateY(-8px)}}
.wb h4{margin:12px 0 4px;font-size:14px}.wb ul{margin:0;padding-inline-start:20px}.wb li{margin:2px 0}
.wy[open] li{animation:ri .45s both;animation-delay:calc(var(--k)*70ms)}
.qs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.qs li{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);transition:.25s}
.qs li:hover{transform:translateY(-3px);border-color:var(--pri);box-shadow:var(--sh)}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;animation:pp .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*90ms)}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
.ld .h::after{content:"";display:inline-block;width:14px;height:14px;margin-inline-start:8px;border:2px solid var(--pri);border-top-color:transparent;border-radius:50%;animation:sn .7s linear infinite;vertical-align:middle}
.c.cc{border-color:var(--hi);animation:cp 1.6s infinite}
.crit{background:var(--hib);color:var(--hi);border:2px solid var(--hi);border-radius:14px;padding:12px 16px;margin-bottom:14px;animation:cp 1.6s infinite}.crit ul{margin:6px 0 0;padding-inline-start:20px}
@keyframes cp{50%{box-shadow:0 0 0 7px rgba(220,38,38,.18)}}
.ringb{display:flex;align-items:center;gap:16px;margin-bottom:14px}.ringb svg{width:104px;flex:none}
.rb{fill:none;stroke:var(--line);stroke-width:9}.rf{fill:none;stroke:var(--pri);stroke-width:9;stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1),stroke .5s}
.rtx{font-size:20px;font-weight:800;fill:var(--ink)}#rtx{font-size:15px}#rtx b{font-size:26px;display:block}
.gh{margin:18px 0 2px;font-size:15px;color:var(--pri)}
.pi{font-size:20px;flex:none}
.prof{margin:0 0 10px}.prof input,.prof select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.ck{display:inline-block;color:#fff;background:var(--pri);width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center;animation:pp .5s both}
.chart{width:100%;max-width:440px;direction:ltr;display:block;margin-top:8px}.band{fill:var(--okb);opacity:.7}
.ln{fill:none;stroke:var(--pri);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.2s .2s forwards}@keyframes dl{to{stroke-dashoffset:0}}
.pt{fill:var(--pri);animation:pp .5s both}.tx{font-size:10px;fill:var(--ink)}.tx2{font-size:9px;fill:var(--mut)}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:12px;font-family:"Cairo",Arial,sans-serif}#pr table{width:100%;border-collapse:collapse;margin:8px 0}#pr td,#pr th{border:1px solid #999;padding:5px;text-align:start}#pr h1{margin:0}}
@media(max-width:600px){.sum{grid-template-columns:repeat(2,1fr)}.hero{padding-top:76px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="logo"><i>🩺</i>MedCare</div><div><button class="ib" id="spk" data-t="spk">🔊</button><button class="ib" id="fz" data-t="fz">A+</button><button class="ib" id="th" aria-label="theme">◐</button><button class="ib" id="lg">EN</button></div></header>
<section class="hero">
  <i class="bl b1"></i><i class="bl b2"></i>
  <h1 data-i="title"></h1><p data-i="sub"></p>
  <svg class="ecg" viewBox="0 0 900 48" preserveAspectRatio="none" aria-hidden="true"><path d="M0 28H260l14-4 10 4h40l10-24 14 44 14-20h50l12-6 12 6h464"/></svg>
</section>
<main>
  <nav class="tabs rise"><button data-tab="lab" class="on" data-i="tabL"></button><button data-tab="rx" data-i="tabR"></button></nav>
  <section class="box rise gb">
    <div class="drop" id="drop"><label class="pk"><input type="file" id="file" accept="image/*">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/></svg>
      <span data-i="drop"></span></label>
      <span class="pvw" id="pvx"><img id="pv" alt="" hidden></span>
      <button class="btn" type="button" id="cam" data-i="cam"></button><input type="file" id="cam_in" accept="image/*" capture="environment" hidden></div>
    <div class="row prof"><input type="number" id="age" min="0" max="120" inputmode="numeric" data-p="age" style="width:92px"><select id="sex"><option value="" data-i="sex0"></option><option value="m" data-i="sexm"></option><option value="f" data-i="sexf"></option></select><input type="text" id="alg" data-p="alg" style="flex:1;min-width:150px"></div>
    <textarea id="inp" spellcheck="false" aria-label="text"></textarea>
    <div class="row"><button class="btn p" id="go" data-i="go"></button><button class="btn" id="smp" data-i="smp"></button><button class="btn" id="clr" data-i="clr"></button><span class="mut" id="st"></span></div>
    <div id="cdb" hidden style="margin-top:8px;color:var(--lo);font-weight:600"></div>
  </section>
  <section id="res" hidden>
    <div class="box rv ringb" id="ring" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rb" cx="50" cy="50" r="42"/><circle class="rf" id="rf" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"/><text class="rtx" id="rt" x="50" y="57" text-anchor="middle"></text></svg><div id="rtx"></div></div>
    <div class="crit rv" id="crit" hidden></div>
    <div class="sum" id="sum"></div>
    <div class="box" style="margin-top:14px">
      <div class="tb"><input type="text" id="q" data-p="q"><button class="btn" id="vw" data-t="vw">☰</button><button class="btn" id="sv" data-t="sv">💾</button><button class="btn" id="pdf" data-t="pdf">📄</button><button class="btn" id="shr" data-t="shr">📤</button></div>
      <div id="out"></div>
      <p class="mut" id="none" hidden data-i="none"></p>
      <p class="mut" id="src"></p>
    </div>
    <div class="box rv" id="pat" style="margin-top:14px" hidden><h3 class="h" data-i="patT"></h3><ul class="qs" id="patL"></ul></div>
    <div class="box rv" id="ddi" style="margin-top:14px" hidden><h3 class="h" data-i="ddiT"></h3><ul class="qs" id="ddiL"></ul></div>
    <div class="box rv" id="fx" style="margin-top:14px" hidden><h3 class="h" data-i="fxT"></h3><ul class="qs" id="fxL"></ul></div>
    <div class="box rv" id="sch" style="margin-top:14px" hidden><h3 class="h" data-i="schT"></h3><div class="tw"><table id="schTb"></table></div><div class="row"><button class="btn" id="ics" data-i="ics"></button></div></div>
    <div class="box rv" id="why" style="margin-top:14px" hidden><h3 class="h" data-i="whyT"></h3><p class="mut" data-i="whyD" style="margin:0 0 4px"></p><div id="whyL"></div><p class="mut" data-i="whyN" style="margin-bottom:0"></p></div>
    <div class="box rv" id="qb" style="margin-top:14px" hidden><h3 class="h" data-i="qT"></h3><ol class="qs" id="qL"></ol></div>
  </section>
  <section class="box rv" id="hist" hidden><h3 class="h" data-i="histT"></h3><p class="mut" data-i="histN" style="margin:0 0 6px"></p><div id="hC"></div><div id="hL"></div></section>
  <p class="mut" data-i="disc"></p>
</main>
<footer class="ft rv">Designed By Jad Moualla</footer>
<div id="pr"></div><div id="toast"></div>
<script>
const S={
title:["افهم تحاليلك ووصفاتك الطبية بثوانٍ","Understand your labs and prescriptions in seconds"],
sub:["الصق النص أو ارفع صورة، وMedCare يستخرج النتائج ويصنفها تلقائياً.","Paste text or upload a photo and MedCare extracts and classifies the results."],
tabL:["🧪 تقرير تحاليل","🧪 Lab report"],tabR:["💊 وصفة طبية","💊 Prescription"],
drop:["اضغط لرفع صورة أو التقاط صورة بالكاميرا","Tap to upload or take a photo"],
go:["حلّل","Analyze"],smp:["مثال تجريبي","Sample"],clr:["مسح","Clear"],
all:["الكل","All"],Normal:["طبيعي","Normal"],High:["مرتفع","High"],Low:["منخفض","Low"],
q:["ابحث...","Search..."],none:["لا توجد نتائج. ضع كل فحص أو دواء في سطر مستقل.","No results. Put each test or medicine on its own line."],
busy:["جارٍ التحليل...","Analyzing..."],ocr:["جارٍ قراءة الصورة...","Reading the image..."],fail:["تعذّرت قراءة الصورة. جرّب صورة أوضح أو الصق النص يدوياً.","Couldn't read the image. Try a clearer photo or paste the text."],
src:["طريقة التحليل: ","Analysis: "],loc:["قراءة مباشرة","Direct reading"],gem:["تحليل ذكي","Smart analysis"],
cols:[["الفحص","القيمة","الوحدة","النطاق المرجعي","الحالة"],["Test","Value","Unit","Reference range","Status"]],
ref:["النطاق","Range"],meds:["أدوية","Medicines"],

function printHTML(){
  const R=rows[tab],ix=lang==="ar"?0:1,pf=[prof.age!=null?tr("age")+": "+prof.age:"",prof.sex?(prof.sex==="m"?tr("sexm"):tr("sexf")):""].filter(Boolean).join(" · ");
  const body=tab==="lab"?`<table><tr>${S.cols[ix].map(c=>`<th>${c}</th>`).join("")}</tr>${R.map(r=>`<tr><td>${esc(ix?r.en:r.ar)}</td><td>${esc(r.q?r.qv:r.value)}</td><td>${esc(r.unit)}</td><td>${esc(pk(r.range))}</td><td>${lbl(r)}</td></tr>`).join("")}</table>`:`<table><tr><th>${tr("sch0")}</th><th>·</th><th>🕒</th><th>📅</th><th>🍽</th></tr>${R.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.dose||"")} ${esc(pk(r.form))}</td><td>${esc(pk(r.freq))}</td><td>${esc(pk(r.dur))}</td><td>${esc(pk(r.ins))}</td></tr>`).join("")}</table>`;
  const q=[...document.querySelectorAll("#qL li span:last-child")].map(e=>`<li>${esc(e.textContent)}</li>`).join(""),p=[...document.querySelectorAll("#patL li span:last-child")].map(e=>`<li>${esc(e.textContent)}</li>`).join("");
  return `<h1>MedCare</h1><p>${new Date().toLocaleDateString(lang==="ar"?"ar":"en")}${pf?" — "+esc(pf):""}</p>${body}${p?`<h3>${tr("patT")}</h3><ul>${p}</ul>`:""}${q?`<h3>${tr("qT")}</h3><ol>${q}</ol>`:""}<p><small>${tr("disc")}</small></p><p><b>Designed By Jad Moualla</b></p>`}
function speak(){try{const s=speechSynthesis;if(s.speaking){s.cancel();return}const R=rows[tab];if(!R.length)return;const ar=lang==="ar";let t;
  if(tab==="lab"){const n=R.length,ab=R.filter(r=>r.status!=="Normal");t=ar?`تم تحليل ${n} فحصاً. ${n-ab.length} ضمن الطبيعي و${ab.length} خارج الطبيعي. `:`${n} tests analyzed. ${n-ab.length} normal and ${ab.length} abnormal. `;
    R.filter(r=>critOf(r)).forEach(r=>t+=(ar?"تنبيه حرج: ":"Critical: ")+(ar?r.ar:r.en)+". ");ab.slice(0,8).forEach(r=>t+=(ar?r.ar:r.en)+" "+lbl(r)+". ")}
  else t=R.map(r=>[r.name,r.dose,pk(r.freq)].filter(Boolean).join(" ")).join(". ");
  t+=ar?" هذه معلومات للتوعية فقط، راجع طبيبك.":" This is for information only. Please consult your doctor.";
  const u=new SpeechSynthesisUtterance(t);u.lang=ar?"ar-SA":"en-US";u.rate=.95;s.speak(u)}catch(e){}}
function icsFile(){
  const pad=n=>String(n).padStart(2,"0"),d=new Date(),ds=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()),H=[8,13,19,22],E=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MedCare//EN"];
  rows.rx.forEach((r,ri)=>{const s=slots(r.freq);if(!Array.isArray(s))return;const m=en2(r.dur).match(/(\d+)\s*(day|week|month)/i),days=m?+m[1]*(/week/i.test(m[2])?7:/month/i.test(m[2])?30:1):7;
    s.forEach((on,k)=>{if(on)E.push("BEGIN:VEVENT","UID:mc"+Date.now()+ri+k+"@medcare","DTSTAMP:"+ds+"T000000","DTSTART:"+ds+"T"+pad(H[k])+"0000","DURATION:PT15M","RRULE:FREQ=DAILY;COUNT="+days,"SUMMARY:💊 "+r.name+(r.dose?" "+r.dose:""),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+r.name,"TRIGGER:-PT0M","END:VALARM","END:VEVENT")})});
  E.push("END:VCALENDAR");const a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(E.join("\r\n"));a.download="medcare-schedule.ics";document.body.appendChild(a);a.click();a.remove();toast(tr("icsok"))}
$("sv").onclick=saveHist;$("spk").onclick=speak;$("ics").onclick=icsFile;
$("pdf").onclick=()=>{$("pr").innerHTML=printHTML();try{window.print()}catch(e){toast(tr("noprint"))}};
$("shr").onclick=async()=>{const t=summaryText();try{if(navigator.share){await navigator.share({title:"MedCare",text:t})}else{await navigator.clipboard.writeText(t);toast(tr("copied"))}}catch(e){try{await navigator.clipboard.writeText(t);toast(tr("copied"))}catch(x){toast(tr("noprint"))}}};
const ZS=[1,1.15,1.3];let zi=+store.get("mc_z")||0;const applyZ=()=>{document.querySelector("main").style.zoom=ZS[zi]};
$("fz").onclick=()=>{zi=(zi+1)%3;store.set("mc_z",zi);applyZ();toast("A "+Math.round(ZS[zi]*100)+"%")};applyZ();
try{prof=Object.assign(prof,JSON.parse(store.get("mc_prof")||"{}"))}catch(e){}
$("age").value=prof.age??"";$("sex").value=prof.sex||"";$("alg").value=prof.allergy||"";
["age","sex","alg"].forEach(i=>$(i).addEventListener("change",readProf));
// ===== smart-analysis cooldown: 3 uses, then 2 / 5 / 10 / 30 / 60 minutes
const CDM=[2,5,10,30,60],cd0=()=>({n:0,lvl:0,until:0,lastUse:0});
const cds=()=>{try{return Object.assign(cd0(),JSON.parse(store.get("mc_cd")||"{}"))}catch(e){return cd0()}};
const cdLeft=()=>Math.max(0,cds().until-Date.now()),aiOK=()=>cdLeft()===0;
function aiUse(){const s=cds(),t=Date.now();if(t-s.lastUse>6*36e5){s.n=0;s.lvl=0}s.lastUse=t;s.n++;if(s.n>=3){s.until=t+CDM[s.lvl]*6e4;s.lvl=Math.min(s.lvl+1,CDM.length-1);s.n=0}store.set("mc_cd",JSON.stringify(s))}
function cdTick(){const l=cdLeft(),b=$("cdb");b.hidden=l<=0;if(l>0)b.textContent=tr("cdT")+": "+Math.floor(l/6e4)+":"+String(Math.floor(l%6e4/1e3)).padStart(2,"0")+" — "+tr("cdN")}
setInterval(cdTick,1000);
lang=store.get("mc_lang")||"ar";
function dbgBox(){if($("dbg"))return;const b=document.createElement("div");b.className="box";b.innerHTML='<button class="btn p" id="dbg">Test connection</button><pre id="dbo" style="white-space:pre-wrap;direction:ltr;text-align:left;margin:10px 0 0"></pre>';document.querySelector("main").appendChild(b);
  $("dbg").onclick=async()=>{const o=$("dbo");o.textContent="";for(const m of MODELS){try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"Reply with the word OK"}]}]})});const j=await r.json().catch(()=>({}));o.textContent+=m+" -> HTTP "+r.status+(j.error?" "+String(j.error.message).slice(0,90):"")+"\n"}catch(e){o.textContent+=m+" -> "+e.name+": "+e.message+"\n"}}}}
let lc=0,lt=0;document.querySelector(".logo").addEventListener("click",()=>{const n=Date.now();lc=n-lt<1500?lc+1:1;lt=n;if(lc>=5)dbgBox()});
if(location.hash==="#debug")dbgBox();
$("inp").value=SAMPLE.lab;applyLang();cdTick();
</script>
